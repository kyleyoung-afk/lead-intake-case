# Lead intake case study. Fully separate from every other service on this box.
# Nothing here listens on a public interface:
#   app  -> 127.0.0.1:3310, Apache proxies case.kyleyoung.opsharbor.io to it
#   n8n  -> 127.0.0.1:5690, reachable only over Tailscale (tailscale serve)
#   db   -> no published port at all
name: leadcase

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadcase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: leads
      APP_RO_PASSWORD: ${APP_RO_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/schema/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadcase -d leads"]
      interval: 5s
      retries: 20
    networks: [internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-stable}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "127.0.0.1:5690:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: leadcase
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_EDITOR_HOST}/
      WEBHOOK_URL: https://${N8N_EDITOR_HOST}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: America/Chicago
      TZ: America/Chicago
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PUBLIC_API_DISABLED: "false"
      # Keep run history for the interview walkthrough.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 720
      # Values the workflows read with $env.
      LEADCASE_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      LEADCASE_SANDBOX_EMAIL: ${SANDBOX_EMAIL}
      LEADCASE_PUBLIC_URL: https://${PUBLIC_HOST}
      LEADCASE_EDITOR_URL: https://${N8N_EDITOR_HOST}
      LEADCASE_SHEET_ID: ${SHEET_ID}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal]

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "127.0.0.1:3310:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app_ro:${APP_RO_PASSWORD}@db:5432/leads
      N8N_INTAKE_URL: http://n8n:5678/webhook/lead-intake
      N8N_SUMMARY_URL: http://n8n:5678/webhook/logs-summary
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      TEST_TOKEN: ${TEST_TOKEN}
    networks: [internal]

volumes:
  db_data:
  n8n_data:

networks:
  internal:
    driver: bridge
    driver_opts:
      # Fixed name so deploy/firewall.sh can allow reply traffic on it.
      com.docker.network.bridge.name: br-leadcase
    ipam:
      config:
        - subnet: 172.31.250.0/24
