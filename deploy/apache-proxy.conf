# Lead intake case study: case.opsharbor.io -> app container on 127.0.0.1:3310.
# Only the app is public. n8n and Postgres are not reachable from here.
# Real visitor IP comes from the global cPanel Cloudflare remoteip config.
<Location "/.well-known/">
    ProxyPass !
</Location>
ProxyPreserveHost On
ProxyPass        / http://127.0.0.1:3310/ retry=0 timeout=60
ProxyPassReverse / http://127.0.0.1:3310/
RequestHeader set X-Forwarded-Proto "https"
# The only header the app trusts for rate limits. "set" overwrites anything the visitor sent.
RequestHeader set X-Leadcase-Client-IP "%{REMOTE_ADDR}s"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "DENY"
Header always set X-Robots-Tag "noindex, nofollow"
